    <title>OEM 登录 - GEO-SAAS</title>
    <style id="theme-vars">
/* @group-priority: primary, success, info, warning, error */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  /* primary - 紫色/蓝色系 */
  --geo-indigo-50: #eef2ff; /* AI-generated */
  --geo-indigo-100: #e0e7ff; /* AI-generated */
  --geo-indigo-200: #c7d2fe; /* AI-generated */
  --geo-indigo-300: #a5b4fc; /* AI-generated */
  --geo-indigo-400: #818cf8; /* AI-generated */
  --geo-indigo-500: #6366f1; /* @primary */ /* AI-generated */
  --geo-indigo-600: #4f46e5; /* AI-generated */
  --geo-indigo-700: #4338ca; /* AI-generated */
  --geo-indigo-800: #3730a3; /* AI-generated */
  --geo-indigo-900: #312e81; /* AI-generated */

  /* text */
  --geo-slate-50: #f8fafc; /* AI-generated */
  --geo-slate-100: #f1f5f9; /* AI-generated */
  --geo-slate-200: #e2e8f0; /* AI-generated */
  --geo-slate-300: #cbd5e1; /* AI-generated */
  --geo-slate-400: #94a3b8; /* AI-generated */
  --geo-slate-500: #64748b; /* @primary */ /* AI-generated */
  --geo-slate-600: #475569; /* AI-generated */
  --geo-slate-700: #334155; /* AI-generated */
  --geo-slate-800: #1e293b; /* AI-generated */
  --geo-slate-900: #0f172a; /* AI-generated */

  /* surface */
  --geo-gray-50: #fafbfc; /* AI-generated */
  --geo-gray-100: #f4f6f8; /* AI-generated */
  --geo-gray-200: #e8ecf0; /* AI-generated */
  --geo-gray-300: #d1d8e0; /* AI-generated */
  --geo-gray-400: #a0aec0; /* AI-generated */
  --geo-gray-500: #718096; /* @primary */ /* AI-generated */
  --geo-gray-600: #4a5568; /* AI-generated */
  --geo-gray-700: #2d3748; /* AI-generated */
  --geo-gray-800: #1a202c; /* AI-generated */
  --geo-gray-900: #0d1117; /* AI-generated */

  /* success */
  --geo-green-50: #f0fdf4; /* AI-generated */
  --geo-green-100: #dcfce7; /* AI-generated */
  --geo-green-200: #bbf7d0; /* AI-generated */
  --geo-green-300: #86efac; /* AI-generated */
  --geo-green-400: #4ade80; /* AI-generated */
  --geo-green-500: #22c55e; /* @primary */ /* AI-generated */
  --geo-green-600: #16a34a; /* AI-generated */
  --geo-green-700: #15803d; /* AI-generated */
  --geo-green-800: #166534; /* AI-generated */
  --geo-green-900: #14532d; /* AI-generated */

  /* warning */
  --geo-amber-50: #fffbeb; /* AI-generated */
  --geo-amber-100: #fef3c7; /* AI-generated */
  --geo-amber-200: #fde68a; /* AI-generated */
  --geo-amber-300: #fcd34d; /* AI-generated */
  --geo-amber-400: #fbbf24; /* AI-generated */
  --geo-amber-500: #f59e0b; /* @primary */ /* AI-generated */
  --geo-amber-600: #d97706; /* AI-generated */
  --geo-amber-700: #b45309; /* AI-generated */
  --geo-amber-800: #92400e; /* AI-generated */
  --geo-amber-900: #78350f; /* AI-generated */

  /* error */
  --geo-red-50: #fef2f2; /* AI-generated */
  --geo-red-100: #fee2e2; /* AI-generated */
  --geo-red-200: #fecaca; /* AI-generated */
  --geo-red-300: #fca5a5; /* AI-generated */
  --geo-red-400: #f87171; /* AI-generated */
  --geo-red-500: #ef4444; /* @primary */ /* AI-generated */
  --geo-red-600: #dc2626; /* AI-generated */
  --geo-red-700: #b91c1c; /* AI-generated */
  --geo-red-800: #991b1b; /* AI-generated */
  --geo-red-900: #7f1d1d; /* AI-generated */

  /* info */
  --geo-cyan-50: #ecfeff; /* AI-generated */
  --geo-cyan-100: #cffafe; /* AI-generated */
  --geo-cyan-200: #a5f3fc; /* AI-generated */
  --geo-cyan-300: #67e8f9; /* AI-generated */
  --geo-cyan-400: #22d3ee; /* AI-generated */
  --geo-cyan-500: #06b6d4; /* @primary */ /* AI-generated */
  --geo-cyan-600: #0891b2; /* AI-generated */
  --geo-cyan-700: #0e7490; /* AI-generated */
  --geo-cyan-800: #155e75; /* AI-generated */
  --geo-cyan-900: #164e63; /* AI-generated */

  /* === Semantic Aliases (Layer 2) === */
  --primary: var(--geo-indigo-500);
  --primary-foreground: #ffffff;
  --secondary: var(--geo-slate-100);
  --secondary-foreground: var(--geo-slate-900);
  --accent: var(--geo-indigo-600);
  --accent-foreground: #ffffff;
  --background: #ffffff;
  --foreground: var(--geo-slate-900);
  --muted: var(--geo-slate-100);
  --muted-foreground: var(--geo-slate-500);
  --border: var(--geo-slate-200);
  --ring: var(--geo-indigo-500);
  --bg: var(--geo-gray-50);
  --fg: var(--geo-slate-900);
  --rule: var(--geo-slate-200);
  --link: var(--geo-indigo-600);
  --surface: #ffffff;
  --surface-dim: var(--geo-gray-100);
  --surface-bright: #ffffff;
  --surface-container-lowest: #ffffff;
  --surface-container-low: var(--geo-gray-50);
  --surface-container: var(--geo-gray-100);
  --surface-container-high: var(--geo-gray-200);
  --surface-container-highest: var(--geo-gray-300);
  --inverse-surface: var(--geo-slate-800);
  --inverse-on-surface: var(--geo-gray-50);
  --interactive-hover: rgba(99,102,241,0.08);
  --interactive-focus: rgba(99,102,241,0.12);
  --interactive-press: rgba(99,102,241,0.16);
  --error: var(--geo-red-500);
  --error-container: var(--geo-red-50);
  --on-error: #ffffff;
  --on-error-container: var(--geo-red-900);

  /* === Portable Aliases (Layer 3) === */
  --color-background: var(--bg);
  --color-foreground: var(--fg);
  --color-surface: var(--surface);
  --color-surface-container-low: var(--surface-container-low);
  --color-surface-container-high: var(--surface-container-high);
  --color-card: var(--surface);
  --color-sidebar: var(--surface-container-low);
  --color-primary: var(--primary);
  --color-primary-hover: var(--geo-indigo-600);
  --color-on-primary: #ffffff;
  --color-primary-container: var(--geo-indigo-50);
  --color-on-primary-container: var(--geo-indigo-900);
  --color-secondary: var(--geo-slate-200);
  --color-secondary-container: var(--geo-slate-100);
  --color-on-secondary-container: var(--geo-slate-800);
  --color-error: var(--error);
  --color-error-container: var(--error-container);
  --color-on-error: var(--on-error);
  --color-success: var(--geo-green-600);
  --color-warning: var(--geo-amber-600);
  --color-border: var(--rule);
  --color-outline: var(--rule);
  --color-outline-variant: var(--geo-slate-100);
  --color-muted-foreground: var(--muted-foreground);
  --font-family-base: var(--font-body);

  /* === Typography === */
  --font-display: 'DM Sans', sans-serif;
  --font-heading: 'DM Sans', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --font-size-display: 48px;
  --font-size-h1: 36px;
  --font-size-h2: 28px;
  --font-size-h3: 22px;
  --font-size-h4: 18px;
  --font-size-body: 14px;
  --font-size-lead: 16px;
  --font-size-caption: 12px;
  --font-size-eyebrow: 11px;
  --font-size-mono: 13px;

  --font-weight-display: 700;
  --font-weight-h1: 700;
  --font-weight-h2: 600;
  --font-weight-h3: 600;
  --font-weight-h4: 600;
  --font-weight-body: 400;
  --font-weight-lead: 400;
  --font-weight-caption: 400;
  --font-weight-eyebrow: 600;
  --font-weight-mono: 400;

  --line-height-display: 1.15;
  --line-height-h1: 1.2;
  --line-height-h2: 1.25;
  --line-height-h3: 1.3;
  --line-height-h4: 1.4;
  --line-height-body: 1.6;
  --line-height-lead: 1.6;
  --line-height-caption: 1.5;
  --line-height-eyebrow: 1.4;
  --line-height-mono: 1.6;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  /* === Sizing === */
  --size-button-height: 36px;
  --size-input-height: 36px;
  --size-icon-sm: 16px;
  --size-icon-md: 20px;
  --size-icon-lg: 24px;
  --size-avatar-sm: 28px;
  --size-avatar-md: 36px;
  --size-avatar-lg: 48px;
  --sidebar-width: 240px;
  --nav-height: 56px;

  /* === Radius === */
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-xl: 8px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-1: 0 1px 2px 0 rgba(15,23,42,0.05); /* Card */
  --shadow-2: 0 2px 8px -2px rgba(15,23,42,0.08); /* Card Hover */
  --shadow-3: 0 4px 16px -4px rgba(15,23,42,0.12); /* Dropdown */
  --shadow-4: 0 8px 24px -8px rgba(15,23,42,0.16); /* Modal */
  --shadow-5: 0 16px 48px -12px rgba(15,23,42,0.20); /* Overlay */

  /* === Motion === */
  --duration-fast: 150ms;
  --duration-normal: 250ms;
  --duration-slow: 400ms;
  --easing-default: cubic-bezier(0.4, 0, 0.2, 1);
  --easing-enter: cubic-bezier(0, 0, 0.2, 1);
  --easing-exit: cubic-bezier(0.4, 0, 1, 1);
}

.dark {
  --primary: var(--geo-indigo-400);
  --accent: var(--geo-indigo-400);
  --background: var(--geo-gray-900);
  --foreground: var(--geo-gray-50);
  --muted: var(--geo-slate-800);
  --muted-foreground: var(--geo-slate-400);
  --border: var(--geo-slate-700);
  --ring: var(--geo-indigo-400);
  --bg: var(--geo-gray-900);
  --fg: var(--geo-gray-50);
  --rule: var(--geo-slate-700);
  --link: var(--geo-indigo-400);
  --surface: var(--geo-gray-800);
  --surface-dim: var(--geo-gray-900);
  --surface-bright: var(--geo-gray-700);
  --surface-container-lowest: var(--geo-gray-900);
  --surface-container-low: var(--geo-gray-800);
  --surface-container: var(--geo-gray-700);
  --surface-container-high: var(--geo-slate-700);
  --surface-container-highest: var(--geo-slate-600);
  --inverse-surface: var(--geo-gray-100);
  --inverse-on-surface: var(--geo-gray-900);
  --interactive-hover: rgba(129,140,248,0.10);
  --interactive-focus: rgba(129,140,248,0.14);
  --interactive-press: rgba(129,140,248,0.18);
  --error: var(--geo-red-400);
  --error-container: rgba(127,29,29,0.4);
  --on-error: var(--geo-red-900);
  --on-error-container: var(--geo-red-100);
  --shadow-1: 0 1px 2px 0 rgba(0,0,0,0.20);
  --shadow-2: 0 2px 8px -2px rgba(0,0,0,0.28);
  --shadow-3: 0 4px 16px -4px rgba(0,0,0,0.36);
  --shadow-4: 0 8px 24px -8px rgba(0,0,0,0.44);
  --shadow-5: 0 16px 48px -12px rgba(0,0,0,0.52);
}

.geo-h1 { font-family: var(--font-heading); font-size: 2.25rem; font-weight: var(--font-weight-h1); line-height: var(--line-height-h1); }

.geo-h4 { font-family: var(--font-heading); font-size: 1.125rem; font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); }
.geo-body { font-family: var(--font-body); font-size: 0.875rem; font-weight: var(--font-weight-body); line-height: var(--line-height-body); }
.geo-lead { font-family: var(--font-body); font-size: 1rem; font-weight: var(--font-weight-lead); line-height: var(--line-height-lead); }
.geo-caption { font-family: var(--font-body); font-size: 0.75rem; font-weight: var(--font-weight-caption); line-height: var(--line-height-caption); }
.geo-eyebrow { font-family: var(--font-body); font-size: 0.6875rem; font-weight: var(--font-weight-eyebrow); line-height: var(--line-height-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; }
.geo-mono { font-family: var(--font-mono); font-size: 0.8125rem; font-weight: var(--font-weight-mono); line-height: var(--line-height-mono); }
.geo-price { font-family: var(--font-display); font-size: 1.5rem; font-weight: var(--font-weight-display); line-height: var(--line-height-display); font-variant-numeric: tabular-nums; }

    </style>

<body class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, var(--geo-indigo-50) 0%, var(--geo-gray-50) 50%, var(--geo-indigo-50) 100%);">
  <div class="w-full max-w-md">
    <!-- Logo & Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl mb-4" style="background: linear-gradient(135deg, var(--geo-indigo-600) 0%, var(--geo-indigo-500) 100%); box-shadow: 0 8px 24px -8px rgba(99,102,241,0.4);">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-display font-bold text-foreground mb-2">GEO-SAAS 系统</h1>
      <p class="text-muted-foreground text-sm">OEM 合作伙伴登录入口</p>
    </div>

    <!-- Login Card -->
    <div class="rounded-lg p-8" style="background: var(--surface); box-shadow: var(--shadow-4);">
      <form class="space-y-6">
        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-foreground mb-2">
            用户名 / 邮箱
          </label>
          <input
            type="text"
            id="username"
            name="username"
            class="w-full px-4 py-3 rounded-md text-foreground bg-background"
            style="border: 1px solid var(--border); transition: all 0.2s;"
            placeholder="请输入用户名或邮箱"
            required
            onfocus="this.style.borderColor='var(--primary)'; this.style.boxShadow='0 0 0 3px var(--interactive-focus)';"
            onblur="this.style.borderColor='var(--border)'; this.style.boxShadow='none';"
          >
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-foreground mb-2">
            密码
          </label>
          <input
            type="password"
            id="password"
            name="password"
            class="w-full px-4 py-3 rounded-md text-foreground bg-background"
            style="border: 1px solid var(--border); transition: all 0.2s;"
            placeholder="请输入密码"
            required
            onfocus="this.style.borderColor='var(--primary)'; this.style.boxShadow='0 0 0 3px var(--interactive-focus)';"
            onblur="this.style.borderColor='var(--border)'; this.style.boxShadow='none';"
          >
        </div>

        <!-- Remember & Forgot -->
        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input type="checkbox" class="w-4 h-4 rounded" style="border: 1px solid var(--border); accent-color: var(--primary);">
            <span class="ml-2 text-sm text-muted-foreground">记住我</span>
          </label>
          <a href="#" class="text-sm" style="color: var(--link);">忘记密码？</a>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full py-3 px-4 rounded-md font-medium text-base text-white"
          style="background: linear-gradient(135deg, var(--geo-indigo-600) 0%, var(--geo-indigo-500) 100%); box-shadow: 0 4px 12px -2px rgba(99,102,241,0.3); transition: all 0.2s;"
