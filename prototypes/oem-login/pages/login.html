<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OEM 登录 - GEO-SAAS</title>
    <style id="theme-vars">
/* @group-priority: primary, success, info, warning, error */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  /* primary - 紫色/蓝色系 */
  --geo-indigo-50: #eef2ff; /* AI-generated */
  --geo-indigo-100: #e0e7ff; /* AI-generated */
  --geo-indigo-200: #c7d2fe; /* AI-generated */
  --geo-indigo-300: #a5b4fc; /* AI-generated */
  --geo-indigo-400: #818cf8; /* AI-generated */
  --geo-indigo-500: #6366f1; /* @primary */ /* AI-generated */
  --geo-indigo-600: #4f46e5; /* AI-generated */
  --geo-indigo-700: #4338ca; /* AI-generated */
  --geo-indigo-800: #3730a3; /* AI-generated */
  --geo-indigo-900: #312e81; /* AI-generated */

  /* text */
  --geo-slate-50: #f8fafc; /* AI-generated */
  --geo-slate-100: #f1f5f9; /* AI-generated */
  --geo-slate-200: #e2e8f0; /* AI-generated */
  --geo-slate-300: #cbd5e1; /* AI-generated */
  --geo-slate-400: #94a3b8; /* AI-generated */
  --geo-slate-500: #64748b; /* @primary */ /* AI-generated */
  --geo-slate-600: #475569; /* AI-generated */
  --geo-slate-700: #334155; /* AI-generated */
  --geo-slate-800: #1e293b; /* AI-generated */
  --geo-slate-900: #0f172a; /* AI-generated */

  /* surface */
  --geo-gray-50: #fafbfc; /* AI-generated */
  --geo-gray-100: #f4f6f8; /* AI-generated */
  --geo-gray-200: #e8ecf0; /* AI-generated */
  --geo-gray-300: #d1d8e0; /* AI-generated */
  --geo-gray-400: #a0aec0; /* AI-generated */
  --geo-gray-500: #718096; /* @primary */ /* AI-generated */
  --geo-gray-600: #4a5568; /* AI-generated */
  --geo-gray-700: #2d3748; /* AI-generated */
  --geo-gray-800: #1a202c; /* AI-generated */
  --geo-gray-900: #0d1117; /* AI-generated */

  /* success */
  --geo-green-50: #f0fdf4; /* AI-generated */
  --geo-green-100: #dcfce7; /* AI-generated */
  --geo-green-200: #bbf7d0; /* AI-generated */
  --geo-green-300: #86efac; /* AI-generated */
  --geo-green-400: #4ade80; /* AI-generated */
  --geo-green-500: #22c55e; /* @primary */ /* AI-generated */
  --geo-green-600: #16a34a; /* AI-generated */
  --geo-green-700: #15803d; /* AI-generated */
  --geo-green-800: #166534; /* AI-generated */
  --geo-green-900: #14532d; /* AI-generated */

  /* warning */
  --geo-amber-50: #fffbeb; /* AI-generated */
  --geo-amber-100: #fef3c7; /* AI-generated */
  --geo-amber-200: #fde68a; /* AI-generated */
  --geo-amber-300: #fcd34d; /* AI-generated */
  --geo-amber-400: #fbbf24; /* AI-generated */
  --geo-amber-500: #f59e0b; /* @primary */ /* AI-generated */
  --geo-amber-600: #d97706; /* AI-generated */
  --geo-amber-700: #b45309; /* AI-generated */
  --geo-amber-800: #92400e; /* AI-generated */
  --geo-amber-900: #78350f; /* AI-generated */

  /* error */
  --geo-red-50: #fef2f2; /* AI-generated */
  --geo-red-100: #fee2e2; /* AI-generated */
  --geo-red-200: #fecaca; /* AI-generated */
  --geo-red-300: #fca5a5; /* AI-generated */
  --geo-red-400: #f87171; /* AI-generated */
  --geo-red-500: #ef4444; /* @primary */ /* AI-generated */
  --geo-red-600: #dc2626; /* AI-generated */
  --geo-red-700: #b91c1c; /* AI-generated */
  --geo-red-800: #991b1b; /* AI-generated */
  --geo-red-900: #7f1d1d; /* AI-generated */

  /* info */
  --geo-cyan-50: #ecfeff; /* AI-generated */
  --geo-cyan-100: #cffafe; /* AI-generated */
  --geo-cyan-200: #a5f3fc; /* AI-generated */
  --geo-cyan-300: #67e8f9; /* AI-generated */
  --geo-cyan-400: #22d3ee; /* AI-generated */
  --geo-cyan-500: #06b6d4; /* @primary */ /* AI-generated */
  --geo-cyan-600: #0891b2; /* AI-generated */
  --geo-cyan-700: #0e7490; /* AI-generated */
  --geo-cyan-800: #155e75; /* AI-generated */
  --geo-cyan-900: #164e63; /* AI-generated */

  /* === Semantic Aliases (Layer 2) === */
  --primary: var(--geo-indigo-500);
  --primary-foreground: #ffffff;
  --secondary: var(--geo-slate-100);
  --secondary-foreground: var(--geo-slate-900);
  --accent: var(--geo-indigo-600);
  --accent-foreground: #ffffff;
  --background: #ffffff;
  --foreground: var(--geo-slate-900);
  --muted: var(--geo-slate-100);
  --muted-foreground: var(--geo-slate-500);
  --border: var(--geo-slate-200);
  --ring: var(--geo-indigo-500);
  --bg: var(--geo-gray-50);
  --fg: var(--geo-slate-900);
  --rule: var(--geo-slate-200);
  --link: var(--geo-indigo-600);
  --surface: #ffffff;
  --surface-dim: var(--geo-gray-100);
  --surface-bright: #ffffff;
  --surface-container-lowest: #ffffff;
  --surface-container-low: var(--geo-gray-50);
  --surface-container: var(--geo-gray-100);
  --surface-container-high: var(--geo-gray-200);
  --surface-container-highest: var(--geo-gray-300);
  --inverse-surface: var(--geo-slate-800);
  --inverse-on-surface: var(--geo-gray-50);
  --interactive-hover: rgba(99,102,241,0.08);
  --interactive-focus: rgba(99,102,241,0.12);
  --interactive-press: rgba(99,102,241,0.16);
  --error: var(--geo-red-500);
  --error-container: var(--geo-red-50);
  --on-error: #ffffff;
  --on-error-container: var(--geo-red-900);

  /* === Portable Aliases (Layer 3) === */
  --color-background: var(--bg);
  --color-foreground: var(--fg);
  --color-surface: var(--surface);
  --color-surface-container-low: var(--surface-container-low);
  --color-surface-container-high: var(--surface-container-high);
  --color-card: var(--surface);
  --color-sidebar: var(--surface-container-low);
  --color-primary: var(--primary);
  --color-primary-hover: var(--geo-indigo-600);
  --color-on-primary: #ffffff;
  --color-primary-container: var(--geo-indigo-50);
  --color-on-primary-container: var(--geo-indigo-900);
  --color-secondary: var(--geo-slate-200);
  --color-secondary-container: var(--geo-slate-100);
  --color-on-secondary-container: var(--geo-slate-800);
  --color-error: var(--error);
  --color-error-container: var(--error-container);
  --color-on-error: var(--on-error);
  --color-success: var(--geo-green-600);
  --color-warning: var(--geo-amber-600);
  --color-border: var(--rule);
  --color-outline: var(--rule);
  --color-outline-variant: var(--geo-slate-100);
  --color-muted-foreground: var(--muted-foreground);
  --font-family-base: var(--font-body);

  /* === Typography === */
  --font-display: 'DM Sans', sans-serif;
  --font-heading: 'DM Sans', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --font-size-display: 48px;
  --font-size-h1: 36px;
  --font-size-h2: 28px;
  --font-size-h3: 22px;
  --font-size-h4: 18px;
  --font-size-body: 14px;
  --font-size-lead: 16px;
  --font-size-caption: 12px;
  --font-size-eyebrow: 11px;
  --font-size-mono: 13px;

  --font-weight-display: 700;
  --font-weight-h1: 700;
  --font-weight-h2: 600;
  --font-weight-h3: 600;
  --font-weight-h4: 600;
  --font-weight-body: 400;
  --font-weight-lead: 400;
  --font-weight-caption: 400;
  --font-weight-eyebrow: 600;
  --font-weight-mono: 400;

  --line-height-display: 1.15;
  --line-height-h1: 1.2;
  --line-height-h2: 1.25;
  --line-height-h3: 1.3;
  --line-height-h4: 1.4;
  --line-height-body: 1.6;
  --line-height-lead: 1.6;
  --line-height-caption: 1.5;
  --line-height-eyebrow: 1.4;
  --line-height-mono: 1.6;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  /* === Sizing === */
  --size-button-height: 36px;
  --size-input-height: 36px;
  --size-icon-sm: 16px;
  --size-icon-md: 20px;
  --size-icon-lg: 24px;
  --size-avatar-sm: 28px;
  --size-avatar-md: 36px;
  --size-avatar-lg: 48px;
  --sidebar-width: 240px;
  --nav-height: 56px;

  /* === Radius === */
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-xl: 8px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-1: 0 1px 2px 0 rgba(15,23,42,0.05); /* Card */
  --shadow-2: 0 2px 8px -2px rgba(15,23,42,0.08); /* Card Hover */
  --shadow-3: 0 4px 16px -4px rgba(15,23,42,0.12); /* Dropdown */
  --shadow-4: 0 8px 24px -8px rgba(15,23,42,0.16); /* Modal */
  --shadow-5: 0 16px 48px -12px rgba(15,23,42,0.20); /* Overlay */

  /* === Motion === */
  --duration-fast: 150ms;
  --duration-normal: 250ms;
  --duration-slow: 400ms;
  --easing-default: cubic-bezier(0.4, 0, 0.2, 1);
  --easing-enter: cubic-bezier(0, 0, 0.2, 1);
  --easing-exit: cubic-bezier(0.4, 0, 1, 1);
}

.dark {
  --primary: var(--geo-indigo-400);
  --accent: var(--geo-indigo-400);
  --background: var(--geo-gray-900);
  --foreground: var(--geo-gray-50);
  --muted: var(--geo-slate-800);
  --muted-foreground: var(--geo-slate-400);
  --border: var(--geo-slate-700);
  --ring: var(--geo-indigo-400);
  --bg: var(--geo-gray-900);
  --fg: var(--geo-gray-50);
  --rule: var(--geo-slate-700);
  --link: var(--geo-indigo-400);
  --surface: var(--geo-gray-800);
  --surface-dim: var(--geo-gray-900);
  --surface-bright: var(--geo-gray-700);
  --surface-container-lowest: var(--geo-gray-900);
  --surface-container-low: var(--geo-gray-800);
  --surface-container: var(--geo-gray-700);
  --surface-container-high: var(--geo-slate-700);
  --surface-container-highest: var(--geo-slate-600);
  --inverse-surface: var(--geo-gray-100);
  --inverse-on-surface: var(--geo-gray-900);
  --interactive-hover: rgba(129,140,248,0.10);
  --interactive-focus: rgba(129,140,248,0.14);
  --interactive-press: rgba(129,140,248,0.18);
  --error: var(--geo-red-400);
  --error-container: rgba(127,29,29,0.4);
  --on-error: var(--geo-red-900);
  --on-error-container: var(--geo-red-100);
  --shadow-1: 0 1px 2px 0 rgba(0,0,0,0.20);
  --shadow-2: 0 2px 8px -2px rgba(0,0,0,0.28);
  --shadow-3: 0 4px 16px -4px rgba(0,0,0,0.36);
  --shadow-4: 0 8px 24px -8px rgba(0,0,0,0.44);
  --shadow-5: 0 16px 48px -12px rgba(0,0,0,0.52);
}

/* Typography Classes */
.geo-display { font-family: var(--font-display); font-size: 3rem; font-weight: var(--font-weight-display); line-height: var(--line-height-display); letter-spacing: -0.02em; }
.geo-h1 { font-family: var(--font-heading); font-size: 2.25rem; font-weight: var(--font-weight-h1); line-height: var(--line-height-h1); }
.geo-h2 { font-family: var(--font-heading); font-size: 1.75rem; font-weight: var(--font-weight-h2); line-height: var(--line-height-h2); }
.geo-h3 { font-family: var(--font-heading); font-size: 1.375rem; font-weight: var(--font-weight-h3); line-height: var(--line-height-h3); }
.geo-h4 { font-family: var(--font-heading); font-size: 1.125rem; font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); }
.geo-body { font-family: var(--font-body); font-size: 0.875rem; font-weight: var(--font-weight-body); line-height: var(--line-height-body); }
.geo-lead { font-family: var(--font-body); font-size: 1rem; font-weight: var(--font-weight-lead); line-height: var(--line-height-lead); }
.geo-caption { font-family: var(--font-body); font-size: 0.75rem; font-weight: var(--font-weight-caption); line-height: var(--line-height-caption); }
.geo-eyebrow { font-family: var(--font-body); font-size: 0.6875rem; font-weight: var(--font-weight-eyebrow); line-height: var(--line-height-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; }
.geo-mono { font-family: var(--font-mono); font-size: 0.8125rem; font-weight: var(--font-weight-mono); line-height: var(--line-height-mono); }
.geo-price { font-family: var(--font-display); font-size: 1.5rem; font-weight: var(--font-weight-display); line-height: var(--line-height-display); font-variant-numeric: tabular-nums; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-card: var(--color-card);
    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-muted: var(--muted);
    --color-muted-foreground: var(--muted-foreground);
    --color-border: var(--border);
    --color-ring: var(--ring);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --radius-xl: var(--radius-xl);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--background); }
      .text-background { color: var(--background); }
      .bg-foreground { background-color: var(--foreground); }
      .text-foreground { color: var(--foreground); }
      .bg-card { background-color: var(--color-card); }
      .bg-primary { background-color: var(--primary); }
      .text-primary { color: var(--primary); }
      .bg-primary-foreground { background-color: var(--primary-foreground); }
      .text-primary-foreground { color: var(--primary-foreground); }
      .bg-muted { background-color: var(--muted); }
      .text-muted { color: var(--muted); }
      .bg-muted-foreground { background-color: var(--muted-foreground); }
      .text-muted-foreground { color: var(--muted-foreground); }
      .bg-border { background-color: var(--border); }
      .text-border { color: var(--border); }
      .border-border { border-color: var(--border); }
    </style>
</head>
<body>
  <div class="login-root">
    <!-- ===== 左侧：品牌视觉区 ===== -->
    <div class="brand-panel">
      <!-- 轮播图容器 -->
      <div class="banner-carousel" id="bannerCarousel">
        <img src="../assets/banner-1.jpg" alt="" class="banner-slide active">
        <img src="../assets/banner-2.jpg" alt="" class="banner-slide">
        <img src="../assets/banner-3.jpg" alt="" class="banner-slide">
        <img src="../assets/banner-4.jpg" alt="" class="banner-slide">
        <img src="../assets/banner-5.jpg" alt="" class="banner-slide">
        <img src="../assets/banner-6.jpg" alt="" class="banner-slide">
        <!-- 轮播指示器 -->
        <div class="banner-dots" id="bannerDots">
          <span class="dot active" data-index="0"></span>
          <span class="dot" data-index="1"></span>
          <span class="dot" data-index="2"></span>
          <span class="dot" data-index="3"></span>
          <span class="dot" data-index="4"></span>
          <span class="dot" data-index="5"></span>
        </div>
      </div>
      <!-- 暗色遮罩增强文本可读性 -->
      <div style="position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(30,30,60,0.55) 0%, rgba(30,30,60,0.3) 40%, rgba(30,30,60,0.3) 60%, rgba(30,30,60,0.55) 100%); pointer-events: none;"></div>

      <!-- 顶部栏：Logo + 名称 + 了解系统 + 联系客服 -->
      <div style="display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <img src="../assets/logo-icon.jpg" alt="GEO-SAAS Logo" style="width: 40px; height: 40px; border-radius: 10px; object-fit: cover;">
          <span style="font-family: var(--font-display); font-size: 20px; font-weight: 700; color: #ffffff; letter-spacing: -0.01em;">GEO增长平台</span>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
          <div class="contact-trigger">
            <span style="color: rgba(255,255,255,0.92); font-size: 13px; font-weight: 500; cursor: pointer; transition: color 0.2s;">联系客服</span>
            <!-- Hover 弹出层 -->
            <div class="contact-popup">
              <div style="background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 12px 32px -8px rgba(0,0,0,0.18); width: 240px; text-align: center;">
                <div style="font-size: 15px; font-weight: 600; color: var(--foreground); margin-bottom: 20px;">联系客服</div>
                <img src="../assets/qrcode-real.png" alt="客服二维码" style="width: 140px; height: 140px; border-radius: 8px; margin: 0 auto; display: block;">
                <p style="font-size: 12px; color: var(--muted-foreground); margin-top: 12px;">微信扫码联系客服</p>
                <div style="margin-top: 20px; text-align: left;">
                  <div style="font-size: 12px; color: var(--muted-foreground); margin-bottom: 6px;">电话：400-888-9999</div>
                  <div style="font-size: 12px; color: var(--muted-foreground);">微信：190105057</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部版权信息 - 居中 -->
      <div style="position: relative; z-index: 2; text-align: center;">
        <span class="brand-copyright" style="color: rgba(255,255,255,0.75); font-size: 12px;">&copy; 2026 GEO-SAAS. 保留所有权利. &nbsp;&nbsp;|&nbsp;&nbsp; 京ICP备XXXXXXXX号-1</span>
      </div>
    </div>

    <!-- ===== 右侧：登录表单区 ===== -->
    <div class="form-panel">
      <div style="width: 100%; max-width: 380px;">
        <!-- 标题 -->
        <div style="margin-bottom: 36px;">
          <h1 style="font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--foreground); margin-bottom: 8px;">欢迎登录</h1>
          <p style="font-size: 14px; color: var(--muted-foreground);">GEO增长平台</p>
        </div>

        <form>
          <!-- 用户名 -->
          <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 13px; font-weight: 500; color: var(--foreground); margin-bottom: 6px;">用户名</label>
            <input type="text" class="login-input" placeholder="请输入用户名" required>
          </div>

          <!-- 密码 -->
          <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 13px; font-weight: 500; color: var(--foreground); margin-bottom: 6px;">密码</label>
            <input type="password" class="login-input" placeholder="请输入密码" required>
          </div>

          <!-- 验证码 -->
          <div style="margin-bottom: 8px;">
            <label style="display: block; font-size: 13px; font-weight: 500; color: var(--foreground); margin-bottom: 6px;">验证码</label>
            <div style="display: flex; gap: 10px; align-items: center;">
              <input type="text" class="login-input" placeholder="请输入4位验证码" maxlength="4" required style="flex: 1;">
              <img src="../assets/captcha-sample.jpg" alt="验证码" class="captcha-img" id="captchaImg" title="点击更换验证码" style="width: 120px; height: 40px; object-fit: cover;">
              <button type="button" class="refresh-btn" id="refreshCaptcha" title="刷新验证码">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
              </button>
            </div>
          </div>

          <!-- 验证码提示 -->
          <p style="font-size: 11px; color: var(--muted-foreground); margin-bottom: 28px;">点击图片或刷新按钮更换验证码</p>

          <!-- 登录按钮 -->
          <button type="submit" class="login-btn">登 录</button>
        </form>
      </div>
    </div>
  </div>

  <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] { display: inline-flex; align-items: center; justify-content: center; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; background-color: currentColor; }
      .login-root { display: flex; min-height: 100vh; }
      .brand-panel {
        width: 55%;
        background: linear-gradient(160deg, var(--geo-indigo-700) 0%, var(--geo-indigo-600) 40%, var(--geo-indigo-500) 100%);
        display: flex; flex-direction: column; justify-content: space-between;
        padding: 40px 48px 32px;
        position: relative;
      }
      .brand-panel::before {
        content: ''; position: absolute; top: -20%; right: -10%;
        width: 60%; height: 60%;
        background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
        pointer-events: none;
      }
      .brand-panel::after {
        content: ''; position: absolute; bottom: -15%; left: -5%;
        width: 50%; height: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
        pointer-events: none;
      }
      .form-panel {
        width: 45%; display: flex; align-items: center; justify-content: center;
        padding: 48px; background: var(--bg);
      }
      .contact-trigger { position: relative; }
      .contact-popup {
        position: absolute; top: calc(100% + 12px); left: 50%;
        transform: translateX(-50%); opacity: 0; visibility: hidden;
        transition: opacity 0.2s, visibility 0.2s; pointer-events: none; z-index: 20;
      }
      .contact-trigger:hover .contact-popup {
        opacity: 1; visibility: visible; pointer-events: auto;
      }
      .login-input {
        width: 100%; padding: 10px 14px; border: 1px solid var(--border);
        border-radius: 6px; font-size: 14px; color: var(--foreground);
        background: var(--background); transition: border-color 0.2s, box-shadow 0.2s;
        outline: none; font-family: var(--font-body);
      }
      .login-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--interactive-focus); }
      .login-input::placeholder { color: var(--muted-foreground); }
      .login-btn {
        width: 100%; padding: 12px 16px; border: none; border-radius: 6px;
        font-size: 15px; font-weight: 600; color: var(--primary-foreground);
        background: linear-gradient(135deg, var(--geo-indigo-600) 0%, var(--geo-indigo-500) 100%);
        box-shadow: 0 4px 12px -2px var(--interactive-press);
        cursor: pointer; transition: background 0.2s, box-shadow 0.2s; font-family: var(--font-body);
      }
      .login-btn:hover {
        background: linear-gradient(135deg, var(--geo-indigo-700) 0%, var(--geo-indigo-600) 100%);
        box-shadow: 0 6px 16px -2px rgba(99,102,241,0.45);
      }
      .login-btn:active { background: var(--geo-indigo-700); }
      .captcha-img { height: 40px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); user-select: none; }
      .refresh-btn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 4px;
        background: var(--background); cursor: pointer; color: var(--muted-foreground);
        transition: color 0.2s, border-color 0.2s; flex-shrink: 0;
      }
      .refresh-btn:hover { color: var(--primary); border-color: var(--primary); }

      /* 轮播 */
      .banner-carousel {
        position: absolute; inset: 0; z-index: 0; overflow: hidden;
      }
      .banner-slide {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        opacity: 0; transition: opacity 0.8s ease;
      }
      .banner-slide.active { opacity: 1; }
      .banner-dots {
        position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%);
        z-index: 2; display: flex; gap: 8px; pointer-events: auto;
      }
      .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: rgba(255,255,255,0.35); cursor: pointer;
        transition: background 0.3s;
      }
      .dot.active { background: rgba(255,255,255,0.9); }
      .dot:hover { background: rgba(255,255,255,0.7); }

      /* 移动端适配 */
      @media (max-width: 768px) {
        .login-root { flex-direction: column; }
        .brand-panel {
          width: 100%; height: 200px; flex-shrink: 0;
          padding: 16px 20px 12px;
        }
        .form-panel {
          width: 100%; flex: 1; padding: 32px 20px;
          align-items: flex-start; padding-top: 40px;
        }
        .form-panel > div { max-width: 100% !important; }
        .contact-popup { display: none; }
        .brand-panel .brand-copyright { font-size: 10px; white-space: normal; }
      }
      @media (max-width: 480px) {
        .brand-panel { height: 160px; padding: 12px 16px 10px; }
        .form-panel { padding: 28px 16px; padding-top: 32px; }
      }
  </style>
  <script>
    const captchaImg = document.getElementById('captchaImg');
    const refreshBtn = document.getElementById('refreshCaptcha');
    function refreshCaptcha() {
      captchaImg.style.opacity = '0.5';
      setTimeout(() => { captchaImg.style.opacity = '1'; }, 200);
    }
    captchaImg.addEventListener('click', refreshCaptcha);
    refreshBtn.addEventListener('click', refreshCaptcha);

    // 轮播逻辑
    (function() {
      var slides = document.querySelectorAll('.banner-slide');
      var dots = document.querySelectorAll('.dot');
      var current = 0;
      var total = slides.length;
      var timer;
      function goTo(index) {
        slides[current].classList.remove('active');
        dots[current].classList.remove('active');
        current = index % total;
        slides[current].classList.add('active');
        dots[current].classList.add('active');
      }
      function next() { goTo(current + 1); }
      function startAuto() { timer = setInterval(next, 4000); }
      function stopAuto() { clearInterval(timer); }
      dots.forEach(function(dot) {
        dot.addEventListener('click', function() {
          stopAuto();
          goTo(parseInt(this.dataset.index));
          startAuto();
        });
      });
      startAuto();
    })();
  </script>
</body>
</html>
